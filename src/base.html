<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸间 · PDF 花边工坊</title>
<style>

.styles{display:grid;grid-template-columns:repeat(3,1fr)}.style{padding:4px 2px}.style svg{height:33px}.viewer{align-self:start;position:sticky;top:12px}.diyActions{display:flex;gap:6px;margin-top:9px}.diyActions button{flex:1;color:#31543f;background:#eef2e8;padding:8px 3px;font-weight:600}#library{width:100%;margin-top:7px}
dialog{color:inherit;border:1px solid #bac6b7;border-radius:12px;padding:24px;width:min(460px,94vw);max-height:92vh;box-shadow:0 16px 80px #1b332b44;background:#fafbf6}dialog::backdrop{background:#172d2670}dialog h2{margin-bottom:6px}dialog p{margin:0 0 14px}.studioField{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}.studioName{border:1px solid #bfcbbd;border-radius:5px;padding:8px;width:100%}#drawPad{display:block;width:100%;aspect-ratio:2;touch-action:none;cursor:crosshair;border:1px solid #b5c5b3;background-color:white;background-image:radial-gradient(#cbd4c6 1px,transparent 1px);background-size:12px 12px}.drawTools{display:flex;justify-content:end;gap:6px;margin:6px 0}.drawTools button{font-size:12px;padding:4px 9px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pair label{font-size:12px}#repeatPreview{display:block;height:85px;background:#fff;border:1px solid #dee2d8;width:100%}.studioFooter{display:flex;justify-content:flex-end;gap:7px;margin-top:16px}@media(max-width:750px){.viewer{position:static}}

#studio{width:min(850px,96vw);padding:22px 26px}#studioTitle{font-size:25px}.workbench{display:grid;grid-template-columns:minmax(0,1fr) 224px;gap:22px}.sideControls{border-left:1px solid #d3dacd;padding-left:20px}.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.palette button{padding:5px 2px;font-size:12px;background:#f3f6ed}.palette svg{width:26px;height:18px;display:block;margin:auto auto 3px}.editBar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:9px 0 6px}.editBar button,.objectBtns button{font-size:12px;padding:5px 8px}.editBar button[aria-pressed=true]{background:#345643;color:white}.editBar .push{margin-left:auto}.objectBtns{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}.sideControls select{width:100%}.sideControls .pair{display:block}.sideControls .pair label{display:block;margin-top:8px}.sideControls #repeatPreview{height:95px}.studioFooter{border-top:1px solid #d7ddd1;padding-top:12px}.padHint{margin:5px 0 0;color:#597161;font-size:12px}.workbench #drawPad g{cursor:move}.workbench #drawPad circle{cursor:crosshair}
@media(max-width:660px){#studio{padding:14px}.workbench{display:block}.sideControls{border-left:0;padding-left:0}.objectBtns{grid-template-columns:repeat(3,1fr)}.sideControls .pair{display:grid;grid-template-columns:1fr 1fr}.studioFooter{position:sticky;bottom:-15px;background:#fafbf6;padding-bottom:8px}}
#savedRow:not([hidden]){display:flex;align-items:center;gap:6px;margin-top:8px}#savedRow select{flex:1;min-width:0;margin:0}#deleteMotif{white-space:nowrap;padding:6px 8px;font-size:12px;color:#934936}#storageNote{overflow-wrap:anywhere}
#plants{grid-template-columns:repeat(6,minmax(0,1fr))}#plants svg{height:25px;width:32px}@media(max-width:500px){#plants{grid-template-columns:repeat(3,1fr)}}
.styleHeading{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.styleHeading span{font-size:11px;font-weight:400;color:#516852;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:58%}.styleGroup{border-top:1px solid #e1e6da}.styleGroup summary{cursor:pointer;display:flex;align-items:center;gap:7px;padding:9px 2px;font-size:13px;list-style:none}.styleGroup summary::-webkit-details-marker{display:none}.styleGroup summary:before{content:"";border:solid #718773;border-width:0 1.5px 1.5px 0;transform:rotate(-45deg);width:5px;height:5px;margin-right:3px}.styleGroup[open] summary:before{transform:rotate(45deg)}.styleGroup summary small{margin-left:auto;font-size:11px;color:#667661}.styleGroup .styles{padding-bottom:9px}.styleGroup summary:focus-visible{outline:2px solid #ad864b;outline-offset:-2px}
#rangeBox,#gutterBox{margin-top:10px}#rangeBox label,#rangeNote{display:block;font-size:12px}#rangeInput{width:100%;padding:8px;border:1px solid #bcc9bc;border-radius:5px;margin:5px 0;color:inherit}#rangeInput[aria-invalid=true]{border-color:#a55444}#rangeInput[aria-invalid=true]+small{color:#98473a}.gutterLabel{display:flex;align-items:center;gap:6px}.gutterLabel input{accent-color:#55755c}
</style>
<header><div class="brand"><b>❧</b>纸间<small>PAPER ATELIER</small></div><span>●　离线工作台</span></header><main><div class="head"><div><h1>PDF 花边工坊</h1><span class="hint">拖入 PDF，给纸页添一道花边。</span></div><div class="row"><button id="open">＋ 导入 PDF</button><button id="save" class="primary" disabled>↓ 导出 PDF</button></div></div><input id="file" hidden type="file" accept=".pdf,application/pdf">
<div class="grid"><div class="viewer"><div class="toolbar"><strong id="filename">示例 · 春日植物图鉴</strong><div class="row"><button id="minus" aria-label="缩小">−</button><span id="zoom">100%</span><button id="plus" aria-label="放大">＋</button></div></div><div class="desk" id="desk"><div class="sheet"><canvas id="paper" width="320" height="450" aria-label="PDF 花边预览"></canvas></div></div><div class="foot"><span id="size">页面预览</span><div class="row"><button id="prev" aria-label="上一页">‹</button><span id="pages">1 / 1</span><button id="next" aria-label="下一页">›</button></div></div></div>
<aside><h2>花边设置</h2><section><h3 class="styleHeading">花边样式<span id="currentStyle" aria-label="当前样式"></span></h3><div id="styles"></div></section><section><h3>我的 DIY 花边</h3><div class="diyActions"><button id="newMotif">＋ DIY 拼花编辑器</button><button id="editMotif" hidden>编辑当前图案</button></div><div id="savedRow" hidden><select id="library" aria-label="我的花边"></select><button id="deleteMotif" disabled>删除花边</button></div><span class="hint" role="status" id="storageNote"></span></section><section><h3 id="colorLabel">花边颜色</h3><div class="colors" id="colors"><input type="color" id="custom" value="#506a50" aria-label="自选花边颜色" title="自选颜色"></div></section><section class="sliders"><label class="row" for="width">花边宽度<output id="wv"></output></label><input id="width" type="range" min="2" max="15" value="7"><label class="row" for="inset">距纸边<output id="iv"></output></label><input id="inset" type="range" min="1" max="22" value="8"></section><section><h3>排版方式</h3><div class="modeRow"><button class="mode" data-mode="overlay">叠在原页上</button><button class="mode" data-mode="shrink">缩小内容留白</button></div></section><section><div class="row"><label for="scope">应用范围</label><select id="scope"><option value="all">全部页面</option><option value="first">仅封面</option><option value="custom">自定义页码</option></select></div>
<div id="rangeBox" hidden><label for="rangeInput">页码或区间</label><input id="rangeInput" type="text" maxlength="512" placeholder="例如 2-10, 12" aria-describedby="rangeNote" autocomplete="off"><small id="rangeNote" role="status"></small></div></section>
<section><label class="gutterLabel"><input type="checkbox" id="gutter"> 双面打印装订留白</label><div id="gutterBox" hidden><label class="row" for="gutterAmount">花边偏移量<output id="gutterValue"></output></label><input type="range" id="gutterAmount" min="5" max="10" value="5" step="1"><small class="hint">按原 PDF 页序，奇数页右移，偶数页左移。外侧空间不足时自动收窄边框。</small></div></section></aside></div><p id="status" role="status"></p></main>
<dialog id="studio" aria-labelledby="studioTitle"><h2 id="studioTitle">DIY 拼花编辑器</h2>
<div class="workbench"><div><div class="studioField">添加线条与图形</div><div class="palette"><button data-shape="line"><svg viewBox="0 0 25 18" aria-hidden="true"><path d="M2 14 L23 4" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>直线</button><button data-shape="arc"><svg viewBox="0 0 25 18" aria-hidden="true"><path d="M2 14 Q12 -9 23 14" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>圆弧</button><button data-shape="wave"><svg viewBox="0 0 25 18" aria-hidden="true"><path d="M1 9 Q6 -2 12 9 T24 9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>波浪线</button><button data-shape="rect"><svg viewBox="0 0 25 18" aria-hidden="true"><path d="M3 3 H22 V15 H3 Z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>矩形</button><button data-shape="circle"><svg viewBox="0 0 25 18" aria-hidden="true"><path d="M19 9 A7 7 0 1 1 5 9 A7 7 0 1 1 19 9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>圆形</button><button data-shape="triangle"><svg viewBox="0 0 25 18" aria-hidden="true"><path d="M12 2 L23 16 H2 Z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>三角形</button><button data-shape="diamond"><svg viewBox="0 0 25 18" aria-hidden="true"><path d="M12 1 L23 9 L12 17 L1 9 Z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>菱形</button><button data-shape="star"><svg viewBox="0 0 25 18" aria-hidden="true"><path d="M12 1 L15 6.5 L22 7 L17 11 L18 17 L12 14 L6 17 L7 11 L2 7 L9 6.5 Z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>五角星</button></div>
<div class="studioField">花草素材</div><div class="palette" id="plants"></div><div class="editBar"><button id="chooseTool">选择 / 移动</button><button id="penTool">自由手绘</button><button class="push" id="undo">撤销</button><button id="clear">清空</button></div>
<svg id="drawPad" viewBox="0 0 200 100" preserveAspectRatio="none" aria-label="花边组合画板"></svg>
<p class="padHint">拖动图形拼接。拖动直线两端的圆点，可接到其他图形上。</p>
<div class="studioField">四边排列预览</div><svg id="repeatPreview" viewBox="0 0 236 100" aria-label="图案重复效果"></svg>
</div><div class="sideControls"><label class="studioField" for="itemList">当前元素</label><select id="itemList"></select>
<div class="objectBtns"><button data-adjust id="reduce">缩小</button><button data-adjust id="grow">放大</button><button data-adjust id="rotateLeft">左转 15°</button><button data-adjust id="rotateRight">右转 15°</button><button data-adjust id="copyItem">复制</button><button data-adjust id="removeItem">删除</button></div>
<label class="studioField" for="motifName">花边名称</label><input id="motifName" class="studioName" maxlength="40" placeholder="为花边取个名字">
<div class="pair"><label>笔画粗细<input id="pen" type="range" min="1" max="12"></label><label>图案间距<input id="gap" type="range" min="0" max="160" step="5"></label></div></div></div>
<div class="studioFooter"><button id="cancelMotif">取消</button><button class="primary" id="applyMotif">保存并应用</button></div></dialog>
